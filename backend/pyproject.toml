[project]
name = "capi-backend"
version = "0.1.0"
description = "Permission-aware customer commitment intelligence backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "pgvector>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
# Only needed for the real (non-test) embedding provider — embed_missing
# and evaluate.py. The full security/functional test suite uses
# FakeEmbeddingProvider and never imports sentence_transformers, so `dev`
# alone is enough to run `pytest`.
embeddings = ["sentence-transformers>=3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
